# ---- Multi-agent pane workflow ----------------------------------------------
# One tmux session per repo; 2-4 panes, each running a CLI AI agent.
# Zoom (prefix + z, default) stays the primary focus mode.

# 1-index panes/windows so prefix + m/,/./ / maps cleanly to panes 1..4
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on

# Glanceable layout: show [current/total] + running command + zoom flag in
# each pane's border. The active pane's border is drawn even when zoomed,
# so the total pane count stays visible in fullscreen.
set -g pane-border-status top
set -g pane-border-format " [#P/#{window_panes}] #{pane_current_command}#{?window_zoomed_flag, [Z],} "

# prefix + q already shows pane numbers (tmux default); keep it on screen
# long enough to actually read and pick from
set -g display-panes-time 2000

# Direct pane jumps - "switch agent" AND auto-zoom into it.
# Selecting another pane while zoomed auto-unzooms first, then we re-zoom
# only if the window isn't already zoomed (prevents toggling off when you
# press the key for the pane you're already in).
# (overrides defaults: m=mark-pane, ,=rename-window, .=move-window, /=describe-key)
unbind m
unbind ,
unbind .
unbind /
bind-key m select-pane -t :.1 \; if -F '#{!=:#{window_zoomed_flag},1}' 'resize-pane -Z'
bind-key , select-pane -t :.2 \; if -F '#{!=:#{window_zoomed_flag},1}' 'resize-pane -Z'
bind-key . select-pane -t :.3 \; if -F '#{!=:#{window_zoomed_flag},1}' 'resize-pane -Z'
bind-key / select-pane -t :.4 \; if -F '#{!=:#{window_zoomed_flag},1}' 'resize-pane -Z'

# Restore rename-window on a new key (was prefix + ,)
bind-key R command-prompt -I "#W" "rename-window '%%'"

# Fallback cycle through panes; prefix + z (zoom) remains primary focus mode
bind-key o select-pane -t :.+

# Suggested layout for 3-4 agents (no script needed):
#   prefix + l   -> vertical split   (already bound)
#   prefix + k   -> horizontal split (already bound)
#   prefix + M-1..M-5 -> preset layouts (tmux default); "main-vertical"
#   works well for "planner pane left, workers stacked right".
# -----------------------------------------------------------------------------

# To install prefix–I (where prefix = m-tab)
# To update prefix–U
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'


set-option -sg escape-time 10

bind-key -r -T prefix       =                 resize-pane -U 5
bind-key -r -T prefix       -                 resize-pane -D 5


set -g allow-passthrough on
set -g visual-activity off

# set-hook -g client-attached 'run-shell update_display.sh'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
